name: Performance

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/perf/**'
      - 'CMakeLists.txt'
      - '.github/workflows/performance.yml'
  workflow_dispatch:

env:
  QT_VERSION: '6.8.1'
  QT_QPA_PLATFORM: offscreen

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  perf:
    name: Perf budget
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure
        run: |
          cmake -S . -B build-perf \
            -DCMAKE_BUILD_TYPE=Release \
            -DEMERALD_BUILD_PERF_TESTS=ON

      - name: Build
        run: cmake --build build-perf -j

      - name: Run performance benchmarks
        run: |
          ./build-perf/emerald_perf_tests \
            --notes 2500 \
            --words 220 \
            --queries 80 \
            --json perf-ci.json

      - name: Check performance budgets
        run: python3 tests/perf/check_perf_budget.py perf-ci.json

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: emerald-perf-ci
          path: perf-ci.json
