name: Release

# Build Emerald for Linux, macOS and Windows and attach the packages to the
# GitHub Release for the tag. Stable tags use vX.Y.Z; development-channel tags
# use vX.Y.Z-dev.N and are published as GitHub prereleases. Runs automatically
# when a v* tag is pushed, or manually against an existing tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach artifacts to (e.g. v1.0.0)'
        required: true
        default: 'v2.2.2-dev.1'

env:
  QT_VERSION: '6.8.1'

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # qt_arch is empty so install-qt-action auto-detects, except arm64
          # Linux which must be named explicitly. x86_64 builds on 22.04 (older
          # glibc = more portable AppImage); the arm64 Qt 6.8.1 binaries need
          # glibc >= 2.38, so that job uses 24.04-arm (its AppImage in turn
          # needs a reasonably recent glibc).
          - { os: ubuntu-22.04,      name: linux,       cmake_args: '', qt_arch: '' }
          - { os: ubuntu-24.04-arm,  name: linux-arm64, cmake_args: '', qt_arch: 'linux_gcc_arm64' }
          # Build a universal binary so the dmg runs on both Apple Silicon and
          # Intel. The install-qt-action Qt is already universal2, so this only
          # adds the main binary's second slice (negligible size). Single-quote
          # the semicolon list so bash keeps it as one cmake argument.
          # Pinned to macos-14: the migrated macos-latest (macOS 26 / AppleClang
          # 21) SDK dropped the legacy AGL framework that Qt 6.8.1 still links,
          # giving "ld: framework 'AGL' not found". macos-14's SDK still ships it.
          - { os: macos-14,          name: macos,       cmake_args: "-DCMAKE_OSX_ARCHITECTURES='arm64;x86_64'", qt_arch: '' }
          - { os: windows-latest,    name: windows,     cmake_args: '', qt_arch: '' }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Remove stale Microsoft apt sources
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo rm -f /etc/apt/sources.list.d/packages-microsoft-com*.list

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Install NSIS
        if: matrix.name == 'windows'
        run: choco install nsis --version=3.12.0 --yes --no-progress

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG="$RELEASE_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Refusing invalid release tag: $TAG" >&2
            exit 1
          fi
          BUILD_VERSION="${TAG#v}"
          SOURCE_VERSION="$(sed -n 's/^project(Emerald VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [[ "$BUILD_VERSION" != "$SOURCE_VERSION" && "$BUILD_VERSION" != "$SOURCE_VERSION"-* ]]; then
            echo "Tag $TAG does not match source version $SOURCE_VERSION" >&2
            exit 1
          fi
          VERSION_SUFFIX="${BUILD_VERSION:${#SOURCE_VERSION}}"
          echo "EMERALD_VERSION_SUFFIX=$VERSION_SUFFIX" >> "$GITHUB_ENV"

      - name: Configure & build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DEMERALD_VERSION_SUFFIX="$EMERALD_VERSION_SUFFIX" \
            ${{ matrix.cmake_args }}
          cmake --build build --config Release -j

      - name: Package — Linux AppImage
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update && sudo apt-get install -y libfuse2 || true
          ./packaging/linux/make_appimage.sh "$PWD/build-appimage"
          mkdir -p dist && mv Emerald-*.AppImage dist/

      - name: Package — macOS dmg
        if: matrix.name == 'macos'
        run: |
          ( cd build && cpack -G DragNDrop )   # runs macdeployqt via install(SCRIPT)
          mkdir -p dist && mv build/*.dmg dist/

      - name: Package — Windows installer + portable zip
        if: matrix.name == 'windows'
        run: |
          ( cd build && cpack -G ZIP -C Release )
          ( cd build && cpack -G NSIS -C Release )
          mkdir -p dist
          mv build/Emerald-win64.zip dist/
          mv build/Emerald-win64.exe dist/Emerald-win64-setup.exe

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: emerald-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 manifest
        working-directory: dist
        run: sha256sum Emerald-* > SHA256SUMS
      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG="$RELEASE_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Refusing invalid release tag: $TAG" >&2
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Per-tag notes live in .github/release-notes/<tag>.md so each release
            # gets its own write-up. (A single shared file silently reused itself
            # across 1.3.0 → 1.4.1, giving them all identical notes.) Fall back to
            # GitHub's auto-generated notes when a tag has no file yet.
            NOTES=".github/release-notes/${TAG}.md"
            RELEASE_FLAGS=()
            if [[ "$TAG" == *-* ]]; then
              RELEASE_FLAGS+=(--prerelease)
            fi
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" --title "Emerald $TAG" \
                --notes-file "$NOTES" "${RELEASE_FLAGS[@]}"
            else
              gh release create "$TAG" --title "Emerald $TAG" \
                --generate-notes "${RELEASE_FLAGS[@]}"
            fi
          fi
          gh release upload "$TAG" dist/* --clobber
