name: Publish spelling packs

# A reviewed dictionary snapshot is published only when its exact version tag
# is deliberately created. Existing releases are never overwritten.
on:
  push:
    tags:
      - 'spell-dictionaries-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing spell-dictionaries-v* tag to publish'
        required: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Verify and publish immutable pack assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Validate tag and stage assets
        env:
          SPELL_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          manifest_tag="$(python3 -c 'import json; print(json.load(open("resources/dictionaries/manifest.json"))["releaseTag"])')"
          if [[ "$SPELL_TAG" != "$manifest_tag" ]]; then
            echo "Tag $SPELL_TAG does not match manifest tag $manifest_tag" >&2
            exit 1
          fi
          python3 tools/update_spelling_assets.py package dist-spelling

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SPELL_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$SPELL_TAG" >/dev/null 2>&1; then
            echo "Release $SPELL_TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh release create "$SPELL_TAG" dist-spelling/* \
            --verify-tag \
            --title "Emerald spelling dictionaries ${SPELL_TAG#spell-dictionaries-v}" \
            --notes 'Versioned, hash-verified optional spelling dictionaries used by Emerald. Each NOTICE asset contains the corresponding upstream license and attribution.'
